1. Create a new flow YAML file in .maestro/flows/ (e.g., a-tab-smoke.yaml, b-create-exercise.yaml, c-existing-data.yaml)
2. Optionally create or update subflow YAMLs in .maestro/subflows/ for reusable steps
3. Document the new flow and its coverage in e2e/README.md
4. Run the E2E runner to verify the new flow passes

