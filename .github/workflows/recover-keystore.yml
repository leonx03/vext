name: recover-keystore (TEMPORARY — delete after use)

# ONE-TIME keystore recovery for the apps-monorepo migration (Phase 2).
# Reads the release-signing secrets, bundles them into JSON, encrypts the bundle with a
# throwaway passphrase (EXPORT_PASSPHRASE secret — masked in logs), and uploads the
# CIPHERTEXT as an artifact. No secret VALUE is ever printed to the (public) logs.
# DELETE this workflow file + the EXPORT_PASSPHRASE secret after the artifact is decrypted.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Bundle + encrypt signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EXPORT_PASSPHRASE: ${{ secrets.EXPORT_PASSPHRASE }}
        run: |
          set -euo pipefail

          # Bundle all four signing secrets into JSON. jq --arg safely escapes;
          # nothing is echoed to stdout here.
          jq -n \
            --arg b64 "$RELEASE_KEYSTORE_BASE64" \
            --arg sp  "$RELEASE_KEYSTORE_PASSWORD" \
            --arg ka  "$RELEASE_KEY_ALIAS" \
            --arg kp  "$RELEASE_KEY_PASSWORD" \
            '{RELEASE_KEYSTORE_BASE64:$b64, RELEASE_KEYSTORE_PASSWORD:$sp, RELEASE_KEY_ALIAS:$ka, RELEASE_KEY_PASSWORD:$kp}' \
            > bundle.json

          # Non-sensitive sanity output (lengths + keystore fingerprint — NOT the values).
          echo "bundle keys present: $(jq -r 'to_entries | map(.key + "=" + (if (.value|length)>0 then "set(" + (.value|length|tostring) + ")" else "EMPTY" end)) | join(", ")' bundle.json)"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > vext-release.keystore
          echo "keystore size:  $(wc -c < vext-release.keystore) bytes"
          echo "keystore magic: $(head -c4 vext-release.keystore | od -An -tx1 | tr -d ' ')  (feedfeed=JKS, 3082=PKCS12)"
          echo "keystore sha256:$(sha256sum vext-release.keystore | cut -d' ' -f1)"
          # Validate the keystore opens with the recovered store password (alias shown may be masked if it's a secret).
          keytool -list -keystore vext-release.keystore -storepass "$RELEASE_KEYSTORE_PASSWORD" 2>&1 | grep -iE "alias|contains" || echo "keytool listing failed (store password mismatch?)"

          # Encrypt the JSON bundle. The artifact holds ciphertext only.
          openssl enc -aes-256-cbc -salt -pbkdf2 -in bundle.json -out bundle.json.enc -pass env:EXPORT_PASSPHRASE
          echo "ciphertext bytes: $(wc -c < bundle.json.enc)"
          rm -f bundle.json vext-release.keystore

      - name: Upload encrypted bundle
        uses: actions/upload-artifact@v4
        with:
          name: keystore-recovery
          path: bundle.json.enc
          retention-days: 1
